# Free Windows build of dev-browser (agent-ergonomics fork) via AppVeyor.
# Builds on AppVeyor's servers — no local download, no GitHub Actions billing.
# Produces dev-browser-windows-x64.exe as a downloadable artifact.
version: 0.2.8-ergo.{build}
image: Visual Studio 2022
clone_depth: 1

environment:
  RUST_BACKTRACE: 1
  # cargo bin isn't on PATH by default on this image; add it so cargo/rustc
  # resolve in every phase after rustup-init installs them here.
  PATH: 'C:\Users\appveyor\.cargo\bin;%PATH%'

install:
  # Rust is NOT preinstalled on the VS2022 image — install it via rustup-init.
  # (This download happens on AppVeyor's machine, not the user's.)
  - cmd: appveyor DownloadFile https://win.rustup.rs/x86_64 -FileName rustup-init.exe
  - cmd: rustup-init.exe -y --default-toolchain stable --default-host x86_64-pc-windows-msvc --profile minimal
  - cmd: rustc --version
  - cmd: cargo --version
  # Node is preinstalled; enable pnpm via corepack.
  - cmd: node --version
  - cmd: corepack enable
  - cmd: corepack prepare pnpm@10 --activate
  - cmd: pnpm --version

build_script:
  # 1) Build the daemon bundles the CLI embeds via include_str!
  - cmd: cd daemon && pnpm install --no-frozen-lockfile && pnpm run bundle && pnpm run bundle:sandbox-client && cd ..
  # 2) Build the release CLI binary (embeds the fresh daemon bundle)
  - cmd: cd cli && cargo build --release && cd ..
  # 3) Name it the way the installer expects
  - cmd: copy cli\target\release\dev-browser.exe dev-browser-windows-x64.exe

test: off

artifacts:
  - path: dev-browser-windows-x64.exe
    name: dev-browser-windows-x64
